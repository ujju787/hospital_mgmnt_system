<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maa Kalawati Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-8">
            <div class="flex items-center gap-2 text-blue-600 font-bold text-xl">
                <i data-lucide="hospital" class="w-6 h-6"></i>
                <span>Care flow</span>
            </div>
            <div class="hidden md:flex gap-6 text-gray-500 font-medium text-sm">
                <a href="#" class="hover:text-blue-600">Dashboard</a>
                <a href="#" class="hover:text-blue-600">Patients</a>
                <a href="#" class="hover:text-blue-600">Visits</a>
                <a href="#" class="hover:text-blue-600">Feedback</a>
                <a href="#" class="hover:text-blue-600">Messages</a>
                <a href="#" class="hover:text-blue-600 uppercase">Reg_Person</a>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <a href="#" class="bg-blue-50 text-blue-700 px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 border border-blue-100 hover:bg-blue-100 transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
            </a>
            <div class="flex items-center gap-2 text-gray-700">
                <div class="w-10 h-10 bg-cyan-500 rounded-full flex items-center justify-center text-white">
                    <i data-lucide="user" class="w-6 h-6"></i>
                </div>
                <span class="font-medium">Admin</span>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-12 p-4">
        
        <div class="bg-blue-600 rounded-t-3xl p-10 flex justify-between items-center relative overflow-hidden shadow-lg">
            <div class="z-10">
                <h1 class="text-white text-4xl font-bold mb-2">Admin Login</h1>
                <p class="text-blue-100 text-lg">Enter your credentials to access the admin panel.</p>
            </div>
            
            <div class="relative z-10 bg-white/20 p-6 rounded-full border border-white/30 backdrop-blur-sm">
                <i data-lucide="lock" class="w-12 h-12 text-white"></i>
            </div>

            <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-blue-500 rounded-full opacity-50"></div>
        </div>

        <div class="bg-white rounded-b-3xl shadow-xl p-12 border-x border-b border-gray-100">
            <form class="max-w-md mx-auto space-y-8">
                
                <div>
                    <label class="block text-gray-800 font-bold mb-2 text-sm">Mobile Number</label>
                    <input type="text" 
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
                        placeholder="Enter mobile number">
                </div>

                <div>
                    <label class="block text-gray-800 font-bold mb-2 text-sm">Password</label>
                    <div class="relative">
                        <input type="password" 
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
                            placeholder="Enter password">
                        <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-[0.98]">
                    Login
                </button>

            </form>
        </div>

    </main>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
