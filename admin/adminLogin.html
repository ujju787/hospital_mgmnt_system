  <body class="bg-gray-50 min-h-screen font-sans">
    <nav class="flex items-center justify-between px-8 py-4 bg-white shadow-sm">
      <div class="flex items-center space-x-2">
        <div class="bg-emerald-500 p-2 rounded-full">
          <i class="fas fa-heartbeat text-white text-xl"></i>

        <span class="text-2xl font-bold text-gray-700 tracking-tight"
          ><span style="color: green">Care</span>Flow</span
        >
      </div>

      <div
        class="hidden md:flex items-center space-x-6 text-gray-600 font-medium"
      >
        <a href="adminDashboard.php" class="hover:text-emerald-500"
          >Dashboard</a
        >
        <a href="admin.patent.html" class="hover:text-emerald-500">Patients</a>

          >Registration</a
        >
      </div>

      <div class="flex items-center space-x-4">
        <a
          href="../../index.html"
          class="bg-emerald-50 text-emerald-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-100 transition border border-emerald-200"
        >
          <i class="fas fa-arrow-left mr-2"></i>Back to Home
        </a>
      </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-12 p-4">
      <div
        class="bg-emerald-500 rounded-t-3xl p-10 flex justify-between items-center relative overflow-hidden shadow-lg"
      >
        <div class="z-10">
          <h1 class="text-white text-4xl font-bold mb-2">Admin Login</h1>
          <p class="text-emerald-100 text-lg">
            Enter your credentials to access the admin panel.
          </p>
        </div>

        <div
          class="relative z-10 bg-white/20 p-6 rounded-full border border-white/30 backdrop-blur-sm"
        >
          <i class="fas fa-lock text-white text-3xl"></i>
        </div>

        <div
          class="absolute -right-10 -bottom-10 w-64 h-64 bg-emerald-400 rounded-full opacity-50"
        ></div>
      </div>

      <div
        class="bg-white rounded-b-3xl shadow-xl p-12 border-x border-b border-gray-100"
      >
        <form
          class="max-w-md mx-auto space-y-8"
          action="../php/login_action.php"
          method="POST"
        >
          <div>
            <label class="block text-gray-800 font-bold mb-2 text-sm"
              >Mobile Number</label
            >
            <input
              type="text"
              name="mobile_number"
              required
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
              placeholder="Enter mobile number"
            />
          </div>

          <div>
            <label class="block text-gray-800 font-bold mb-2 text-sm"
              >Password</label
            >
            <div class="relative">
              <input
                type="password"
                id="passwordInput"
                name="password"
                required
                class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
                placeholder="Enter password"
              />
              <button
                type="button"
                onclick="togglePasswordVisibility()"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-emerald-500"
              >
                <i id="eyeIcon" class="fas fa-eye w-5 h-5"></i>
              </button>
            </div>
          </div>

          <button
            type="submit"
            class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-200 transition-all active:scale-[0.98]"
          >
            Login
          </button>
        </form>
      </div>
    </main>

    <script>
      function togglePasswordVisibility() {
        const passwordInput = document.getElementById("passwordInput");
        const eyeIcon = document.getElementById("eyeIcon");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          eyeIcon.classList.remove("fa-eye");
          eyeIcon.classList.add("fa-eye-slash");
        } else {
          passwordInput.type = "password";
          eyeIcon.classList.remove("fa-eye-slash");
          eyeIcon.classList.add("fa-eye");
        }
      }
    </script>
  </body>
