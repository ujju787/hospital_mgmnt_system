<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareFlow - Patient Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>
<body class="bg-[#10b981] min-h-screen flex flex-col font-sans">

    <nav class="flex items-center justify-between px-8 py-4 bg-white shadow-md">
        <div class="flex items-center space-x-2">
            <div class="bg-[#10b981] p-1.5 rounded-full">
                <i class="fas fa-heartbeat text-white text-lg"></i>
            </div>
            <span class="text-xl font-bold text-gray-800 tracking-tight"><span style="color:green;">Care</span>Flow</span>
        </div>

        <div class="flex items-center space-x-8 text-gray-700 font-medium">
            <a href="../index.html" class="hover:text-emerald-600 transition">Home</a>
            <a href="../aboutus.html" class="hover:text-emerald-600 transition">About Us</a>
            <a href="../contact.html" class="hover:text-emerald-600 transition">Contact</a>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-lg p-10 md:p-12">
            
            <div class="text-center mb-8">
                <h1 class="text-4xl md:text-5xl text-[#10b981] mb-3" style="font-family: 'Pacifico', cursive;">
                    Patient Registration
                </h1>
                <p class="text-gray-500 font-medium leading-tight">
                    Create your account to book appointments and <br> access services.
                </p>
            </div>

            <form class="space-y-5">
                <div>
                    <label class="block text-gray-700 font-bold mb-1.5 ml-1" for="name">Name</label>
                    <input 
                        required
                        type="text" 
                        id="name"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
                        placeholder=""
                    >
                </div>

                <div>
                    <label class="block text-gray-700 font-bold mb-1.5 ml-1" for="mobile">Mobile Number</label>
                    <input 
                        required
                        type="tel" 
                        id="mobile"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
                        placeholder=""
                    >
                </div>

                <div>
                    <label class="block text-gray-700 font-bold mb-1.5 ml-1" for="gender">Gender</label>
                    <select 
                        id="gender"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition bg-white text-gray-600"
                    >
                        <option>Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-700 font-bold mb-1.5 ml-1" for="password">Password</label>
                    <div class="relative">
                        <input 
                            required
                            type="password" 
                            id="password"
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
                        >
                        <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                    <p class="text-[11px] text-gray-400 mt-1 ml-1">
                        Min 8 chars, uppercase, lowercase, number, special char
                    </p>
                </div>

                <button type="submit" class="w-full bg-[#10b981] hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl text-lg shadow-lg transition-all transform active:scale-95 mt-4">
                    Register
                </button>
            </form>

        </div>
    </main>

</body>
</html>
